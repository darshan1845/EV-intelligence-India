<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Energy Consumption Prediction</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/energy_consumption.css') }}">
</head>

<body>

    <h1>EV Energy Consumption Prediction</h1>
    <p>Enter the following details to predict the Energy Consumption</p>

    <form action=" " method="POST">

        <label for="vehicle_type">Vehicle Type:</label>
        <select id="vehicle_type" name="vehicle_type" required>
            <option value="" hidden>Select vehicle type</option>
            <option value="0">2W</option>
            <option value="1">3W</option>
            <option value="2">4W</option>
        </select>
        <br><br>

        <label for="battery_capacity_kwh">Battery Capacity (kWh):</label>
        <input type="number" id="battery_capacity_kwh"
               name="battery_capacity_kwh" step="any" required>
        <br><br>

        <label for="battery_health_pct">Battery Health (%):</label>
        <input type="number" id="battery_health_pct"
               name="battery_health_pct" min="0" max="100"
               step="any" required>
        <br><br>

        <label for="distance_km">Distance (km):</label>
        <input type="number" id="distance_km"
               name="distance_km" step="any" required>
        <br><br>

        <label for="daily_trip_count">Daily Trip Count:</label>
        <input type="number" id="daily_trip_count"
               name="daily_trip_count" min="0" required>
        <br><br>

        <label for="charging_frequency_per_week">
            Charging Frequency per Week:
        </label>
        <input type="number" id="charging_frequency_per_week"
               name="charging_frequency_per_week" step="any" required>
        <br><br>

        <label for="charging_type">Charging Type:</label>
        <select id="charging_type" name="charging_type" required>
            <option value="" hidden >Select Charging Type</option>
            <option value="1">Public Fast</option>
            <option value="2">Public Slow</option>
            <option value="0">Home</option>
        </select>
        <br><br>

        <label for="charging_station_distance_km">
            Charging Station Distance (km):
        </label>
        <input type="number" id="charging_station_distance_km"
               name="charging_station_distance_km" step="any" required>
        <br><br>

        <label for="electricity_cost_per_kwh">
            Electricity Cost per kWh:
        </label>
        <input type="number" id="electricity_cost_per_kwh"
               name="electricity_cost_per_kwh" step="any" required>
        <br><br>

        <label for="weather_condition">Weather Condition:</label>
        <select id="weather_condition" name="weather_condition" required>
            <option value="" hidden >Select weather</option>
            <option value="0">Clear</option>
            <option value="1">Extreme Heat</option>
            <option value="2">Humid</option>
            <option value="3">Rainy</option>
        </select>
        <br><br>

        <label>Traffic Density:</label>

        <input type="range"
            id="traffic_density"
            name="traffic_density"
            min="0.009"
            max="1.000"
            step="0.001"
            value="0.450">

        <br>

        <output id="trafficValue">0.450</output>

        <p id="trafficCategory">Traffic Category: Medium Traffic</p>

        <script>
            const trafficSlider = document.getElementById("traffic_density");
            const trafficValue = document.getElementById("trafficValue");
            const trafficCategory = document.getElementById("trafficCategory");

            function updateTrafficCategory() {

                const value = parseFloat(trafficSlider.value);

                trafficValue.textContent = value.toFixed(3);

                if (value <= 0.333) {
                    trafficCategory.textContent = "Traffic Category: Low Traffic";
                }
                else if (value <= 0.666) {
                    trafficCategory.textContent = "Traffic Category: Medium Traffic";
                }
                else {
                    trafficCategory.textContent = "Traffic Category: High Traffic";
                }
            }

            trafficSlider.addEventListener("input", updateTrafficCategory);

            updateTrafficCategory();
        </script>

        <br><br>

        <label for="user_income_level">User Income Level:</label>
        <select id="user_income_level" name="user_income_level" required>
            <option value="" hidden >Select income level</option>
            <option value="1">Low</option>
            <option value="2">Middle</option>
            <option value="0">High</option>
        </select>
        <br><br>

        <label for="range_km_estimated">
            Estimated Range (km):
        </label>
        <input type="number" id="range_km_estimated"
               name="range_km_estimated" step="any" required>
        <br><br>

        <label for="range_anxiety_risk">
            Range Anxiety:
        </label>
        <input type="number" id="range_anxiety_risk"
               name="range_anxiety_risk" step="any" required>
        <br><br>

        <label for="effective_battery_capacity">
            Effective Battery Capacity:
        </label>
        <input type="number" id="effective_battery_capacity"
               name="effective_battery_capacity" step="any" required>
        <br><br>

        <button type="submit">Predict Energy Consumption</button>

    </form>

<script src="{{ url_for('static', filename='js/energy_consumption.js') }}"></script>

</body>
</html>
